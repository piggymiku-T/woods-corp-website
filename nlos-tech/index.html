<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NLOS 非視野イメージング技術 | 株式会社ウッズ・コーポレーション</title>
<style>
    :root {
        --main-blue: #1a56db;
        --dark-blue: #1e3a8a;
        --woods-accent: #0056b3;
        --text-gray: #4b5563;
    }
    body { font-family: "Helvetica Neue", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; margin: 0; padding: 0; background: #fff; line-height: 1.7; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    
    /* 顶部导航 */
    .site-header { padding: 20px 0; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; background: #fff; }
    .site-header .logo-text { font-size: 20px; font-weight: bold; color: var(--woods-accent); text-decoration: none; }
    .exclusive-badge { background: #ef4444; color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 4px; }

    /* ==========================================
       1. 完美的主视觉区 (Hero Section)
       ========================================== */
    .hero-wrapper {
        position: relative;
        width: 100%;
        background-color: #f8fafc;
        overflow: hidden;
    }

    /* 在图片上方覆盖一层轻微的渐变，让文字更清晰 */
    .hero-wrapper::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 60%;
        background: linear-gradient(to bottom, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
        z-index: 1;
        pointer-events: none;
    }

    /* 文字容器，悬浮在图片上方 */
    .hero-content {
        position: absolute;
        top: 10%;
        left: 0;
        width: 100%;
        z-index: 2; /* 确保文字在图片和渐变层之上 */
        text-align: center;
    }

    .hero-content h1 {
        font-size: clamp(28px, 4vw, 48px); /* 使用 clamp 确保在手机和电脑上都能自动缩放 */
        color: var(--dark-blue);
        margin: 0 0 15px 0;
        font-weight: 800;
        letter-spacing: 1px;
        text-shadow: 0 2px 10px rgba(255,255,255,0.8); /* 白边发光，防止和背景混色 */
    }

    .hero-content h2 {
        font-size: clamp(16px, 2vw, 24px);
        color: var(--text-gray);
        margin: 0 0 20px 0;
        font-weight: 600;
    }

    .hero-content .slogan {
        display: inline-block;
        font-size: clamp(18px, 2.5vw, 28px);
        color: var(--main-blue);
        font-weight: bold;
        font-style: italic;
        background: rgba(255,255,255,0.7);
        padding: 10px 30px;
        border-radius: 30px;
        backdrop-filter: blur(5px); /* 毛玻璃效果 */
    }

    /* 图片容器 */
    .hero-image-container {
        width: 100%;
        display: flex;
        justify-content: center;
    }
    
    .hero-image-container img {
        width: 100%;
        max-width: 1400px; /* 防止在大屏幕上无限拉大 */
        height: auto;
        display: block;
        /* 如果你希望底部有暗角，可以加个 mask-image，但目前原样最干净 */
    }

    /* ==========================================
       2. 下方内容占位（等您抠好其他图再替换）
       ========================================== */
    .section { padding: 80px 0; background: #fff; text-align: center; }
    .section-title { font-size: 32px; font-weight: bold; color: var(--dark-blue); margin-bottom: 20px; }
    .placeholder-text { color: #9ca3af; font-size: 16px; margin-bottom: 40px; }

    /* 底部 */
    .footer { text-align: center; padding: 40px 0; background: #f8fafc; color: #9ca3af; font-size: 14px; border-top: 1px solid #e5e7eb; }

    /* 手机端适配 */
    @media (max-width: 768px) {
        .hero-content { top: 5%; }
        .hero-content .slogan { padding: 5px 15px; font-size: 16px; }
        .hero-wrapper::before { height: 70%; }
    }
</style>
</head>
<body>

    <header class="site-header container">
        <a href="https://woods-corp.jp/" class="logo-text">株式会社ウッズ・コーポレーション</a>
        <div><span class="exclusive-badge">日本国内独占代理店</span></div>
    </header>

    <!-- 1. 主视觉区（测试您抠好的图） -->
    <div class="hero-wrapper">
        
        <!-- 悬浮在图片上方的日文标题 -->
        <div class="hero-content">
            <h1>NLOS 非視野イメージング技術</h1>
            <h2>隠れた資産のための計算光学的センシングと物理制約状態逆推定システム</h2>
            <div class="slogan">「見えない世界も、科学の目で見ることができる。」</div>
        </div>

        <!-- 展示您刚刚上传的纯图 -->
        <div class="hero-image-container">
            <img src="/assets/nlos-lp/nlos-hero-clean.jpg" alt="NLOS技術主视觉">
        </div>

    </div>

    <!-- 2. 下方内容区（暂时留白，等待其他图） -->
    <div class="section container">
        <h2 class="section-title">私たちが解決する課題とアプローチ</h2>
        <p class="placeholder-text">（ここに「痛点図」のHTMLを挿入します。他の画像が完成次第、コードを更新します。）</p>
    </div>

    <footer class="footer">
        <p>© 2026 株式会社ウッズ・コーポレーション | 日本国内独占代理店</p>
    </footer>

</body>
</html>
